# Relationship analysis configuration

# Analysis to run: mutual_information, mic, or pearson
analysis: pearson

# CSV file to analyze. Relative paths are resolved from this YAML file.
input_csv: datasets/pokemon/pokemon_complete_2025.csv

# Optional outcome to rank every remaining feature against. Use null to disable
# target-focused output while retaining the complete pairwise analysis.
target_column: null

# Columns to remove before calculating relationships. These fields identify
# individual Pokemon and can create strong but analytically trivial results.
exclude_columns:
  - pokedex_id
  - name
  - description
  - sprite_url
  - askjdh

# "auto" infers column types. Alternatives:
#   true                         - every column is discrete
#   false                        - every column is continuous
#   [col5, col6, col8]           - named discrete columns
#   [false, false, true, ...]    - one boolean for each column
discrete: auto

# Histogram rule for continuous variables. This can be "auto", "fd",
# "sturges", another NumPy histogram rule, an integer, or a list of edges.
bins: auto

# false returns MI in bits. true uses sqrt normalization.
# The strings "sqrt", "min", and "max" are also supported.
normalize: true

# Missing-data policy: pairwise, listwise, or raise
missing: pairwise

# Logarithm base. A value of 2 reports non-normalized MI in bits.
base: 2.0

# MIC grid-budget exponent. Used only when analysis is mic.
alpha: 0.6

# Optional MIC grid-budget cap. Use null for no additional cap.
# A cap can make analysis of large datasets run faster.
max_bins: null

# Number of random shuffles used to estimate each pair's p-value. Higher values
# provide finer p-values but increase runtime. Use 0 to disable permutation tests.
# p-value = (exceeding shuffled scores + 1) / (permutations + 1)
permutations: 100

# Makes permutation p-values reproducible across runs.
random_seed: 42

# Correct raw p-values across all comparisons. Options: benjamini_hochberg, none
# benjamini_hochberg = adjusted p = raw p × number of tests / rank
multiple_comparison: benjamini_hochberg

# Adjusted p-values at or below this threshold are marked significant.
significance_level: 0.05

# Decimal places displayed in the terminal.
round_digits: 3

# Display the terminal matrix with heatmap-style colors.
color_output: true

# Open a graphical spectrogram of the result matrix after analysis.
spectrogram: false

# Set to a filename such as mi_results.csv to save the output.
# Keep this null to only display the matrix.
output_csv: null
